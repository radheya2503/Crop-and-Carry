<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FarmConnect</title>
    <link rel="stylesheet" href="signup.css"> <!-- Linking CSS -->
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Sign Up Section */
        .signup-content {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 400px; /* Fixed width for uniformity */
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #2c6e49; /* Green color for theme */
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between form elements */
        }

        label {
            text-align: left;
            font-weight: bold;
            color: #444;
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="password"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: #2c6e49;
            outline: none;
            box-shadow: 0 0 5px rgba(44, 110, 73, 0.3);
        }

        /* Submit Button */
        .submit-btn {
            background-color: #2c6e49;
            color: white;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #234e33;
        }
    </style>
</head>
<body>
    <section class="signup-content">
        <div class="container">
            <h1>Welcome to FarmConnect!</h1>
            <p>Join us and connect with the farming community.</p>

            <form id="signup-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>

                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </div>
    </section>

    <script src="signup.js"></script>
</body>
</html>
